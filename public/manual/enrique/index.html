:15px\">Envasar lote<\u002Fspan><\u002Fdiv>\n            <div class=\"m-card\">\n              <div class=\"m-row\"><span class=\"m-title\">LT-0488 · Premium Blanco<\u002Fspan><\u002Fdiv>\n              <div class=\"m-sub\">Envasado: 120 / 200 L<\u002Fdiv>\n              <div class=\"m-prog\"><i style=\"width:60%\"><\u002Fi><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"m-card solid-card\">\n              <div class=\"m-sub\" style=\"margin-bottom:6px\">Tipo de envase<\u002Fdiv>\n              <div class=\"m-pill-row\">\n                <span class=\"m-badge b-green\" style=\"border:1px solid color-mix(in srgb,var(--green) 30%,transparent)\">Cubeta 19L<\u002Fspan>\n                <span class=\"m-badge b-gray\">Galón<\u002Fspan>\n                <span class=\"m-badge b-gray\">Litro<\u002Fspan>\n                <span class=\"m-badge b-gray\">Otros<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"m-sub\" style=\"margin:9px 0 6px\">Marca · Tapa<\u002Fdiv>\n              <div class=\"m-pill-row\">\n                <span class=\"m-badge b-gray\">Premium<\u002Fspan>\n                <span class=\"m-badge\" style=\"background:#1e62c9;color:#fff\">Tapa azul<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"m-row\" style=\"margin-top:10px\"><span class=\"m-sub\">Cantidad<\u002Fspan><span class=\"m-title\">6 cubetas = 114 L<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"m-btn\">Agregar al lote<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"mock-note\">\n        <h4>9.1 — 9.2 Registrar un sublote<\u002Fh4>\n        <ol class=\"steps compact\">\n          <li><span class=\"step-body\">En <span class=\"ui\">Stock Fábrica<\u002Fspan>, busca la card del lote y pulsa <span class=\"ui\">Envasar<\u002Fspan>.<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Selecciona tipo de envase: Cubeta (19L), Galón, Litro u “Otros”.<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Selecciona la marca (Premium, Astra, Procaucho…).<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Si es cubeta, elige la tapa por color (el sistema sugiere la default).<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Pon la cantidad de envases. El sistema calcula los litros.<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Pulsa <span class=\"ui\">Agregar al lote<\u002Fspan> y repite por cada combinación.<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Al terminar, pulsa <span class=\"ui\">Confirmar envasado<\u002Fspan>.<\u002Fspan><\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"callout callout--ojo\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"><\u002Fpath><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"><\u002Fline><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"><\u002Fline><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">OJO — <\u002Fspan>El stock de envases y tapas se descuenta al confirmar. Si falta, el sistema avisa y bloquea. Crea una solicitud OC a Arely (sección 8) o pide a Josué que traiga de Terán.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 9.3 Cerrar un lote con merma<\u002Fh3>\n    <p class=\"lead tight\">Si no vas a llenar todos los litros (sobró poco, hubo derrame, etc.), puedes cerrarlo y registrar el sobrante como merma:<\u002Fp>\n    <ol class=\"steps\">\n      <li><span class=\"step-body\">En la card del lote, pulsa <span class=\"ui\">Cerrar (merma)<\u002Fspan>.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">El sistema calcula los litros restantes y los registra como sublote de merma.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">El lote pasa a estado <span class=\"kbd\">envasado<\u002Fspan>.<\u002Fspan><\u002Fli>\n    <\u002Fol>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 9.4 Anular un sublote mal capturado<\u002Fh3>\n    <div class=\"callout callout--info\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"><\u002Fline><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">INFO — <\u002Fspan>Por ahora, si capturas un sublote con la marca/tapa equivocada, NO se puede anular desde la app. Avisa a Emmanuel para que lo corrija. Ya está en el plan agregar el botón de anular.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ════════════════════ 10. TRANSFERIR ════════════════════ -->\n  <section class=\"section\" id=\"sec10\" data-screen-label=\"10 Transferir a Terán\">\n    <div class=\"section-head\">\n      <span class=\"section-num\">10<\u002Fspan>\n      <div>\n        <h2>Transferir sublotes a Terán<\u002Fh2>\n        <div class=\"sec-kicker\">Marca la transferencia para que aparezcan “en camino” y Josué los reciba.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 10.1 Cómo transferir<\u002Fh3>\n    <ol class=\"steps\">\n      <li><span class=\"step-body\">En <span class=\"ui\">Stock Fábrica<\u002Fspan>, expande la card del lote.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Selecciona los sublotes que vas a entregar (checkbox).<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Pulsa <span class=\"ui\">Transferir a Terán<\u002Fspan>.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">El sistema los marca como “en camino” y registra quién hizo la transferencia.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Imprime las etiquetas QR para pegarlas en las cubetas.<\u002Fspan><\u002Fli>\n    <\u002Fol>\n    <div class=\"callout callout--info\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"><\u002Fline><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">INFO — <\u002Fspan>Solo transfiere los que físicamente van a salir de planta. Una vez transferidos, aparecen en la pantalla de Luis (recolección) y la de Josué (recepción).<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 10.2 Imprimir etiquetas QR<\u002Fh3>\n    <div class=\"mock-wrap\">\n      <div class=\"mock-note\">\n        <ol class=\"steps compact\">\n          <li><span class=\"step-body\">En la card del sublote, pulsa <span class=\"ui\">Imprimir QR<\u002Fspan>.<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Elige formato: <strong>Rollo térmico<\u002Fstrong> (1 a la vez) o <strong>A4<\u002Fstrong> (21 o 24 por hoja).<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Pon la cantidad de etiquetas (igual al número de cubetas).<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Imprime y pega cada QR en una cubeta.<\u002Fspan><\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n      <div style=\"flex:none;display:flex;gap:10px;align-items:center\">\n        <div class=\"qr-box\"><\u002Fdiv>\n        <div class=\"qr-box\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ════════════════════ 11. INVENTARIO ════════════════════ -->\n  <section class=\"section\" id=\"sec11\" data-screen-label=\"11 Modificar inventario\">\n    <div class=\"section-head\">\n      <span class=\"section-num\">11<\u002Fspan>\n      <div>\n        <h2>Cómo modificar el inventario<\u002Fh2>\n        <div class=\"sec-kicker\">Corrige stock de MP y PT tras un conteo físico. Cada cambio queda en auditoría y exige código.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 11.1 Cómo modificar el stock de una MP<\u002Fh3>\n    <ol class=\"steps\">\n      <li><span class=\"step-body\">Ve a <span class=\"ui\">Inventario<\u002Fspan>.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Encuentra la MP que vas a corregir.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Pulsa sobre la cantidad (texto subrayado).<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Cambia el valor a la cantidad real.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Pulsa la <strong>palomita azul<\u002Fstrong> para guardar.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Aparece un modal pidiendo <strong>código de autorización<\u002Fstrong>.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Ingresa tu código de Google Authenticator (6 dígitos) o el universal de Emmanuel.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Pulsa <span class=\"ui\">Confirmar<\u002Fspan>. El cambio se aplica y queda en auditoría.<\u002Fspan><\u002Fli>\n    <\u002Fol>\n    <div class=\"callout callout--info\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"><\u002Fline><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">INFO — <\u002Fspan>Si te equivocas en el código, el sistema NO te saca de la sesión. Solo te pide reintentar. Si insistes con código incorrecto, mejor avisa a Emmanuel.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 11.2 Cómo modificar el stock de un PT<\u002Fh3>\n    <p class=\"lead tight\">Mismo procedimiento que MP, pero en la sub-pestaña <span class=\"ui\">Producto Terminado<\u002Fspan>. El PT normalmente se suma solo al finalizar producción — edítalo a mano solo cuando hay una diferencia real (devolución, ajuste de conteo).<\u002Fp>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 11.3 Códigos de autorización<\u002Fh3>\n    <div class=\"cards two\">\n      <div class=\"def-card accent-green\"><div class=\"dc-title\">Google Authenticator<\u002Fdiv><div class=\"dc-desc\">Tu código personal de 6 dígitos. Cambia cada 30 segundos. Solo Emmanuel puede configurarlo en tu celular la primera vez.<\u002Fdiv><\u002Fdiv>\n      <div class=\"def-card accent-amber\"><div class=\"dc-title\">Código universal admin<\u002Fdiv><div class=\"dc-desc\">Código fijo que Emmanuel te da. Úsalo solo si tu Authenticator no funciona o aún no lo tienes configurado.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"callout callout--evitar\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"4.93\" y1=\"4.93\" x2=\"19.07\" y2=\"19.07\"><\u002Fline><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">EVITAR — <\u002Fspan>NUNCA compartas tu código de autorización por WhatsApp ni se lo digas a alguien que llama por teléfono. Si alguien te lo pide, primero confirma con Emmanuel en persona o por una vía verificada.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ════════════════════ 12. PRUEBA VS REAL ════════════════════ -->\n  <section class=\"section\" id=\"sec12\" data-screen-label=\"12 Modo PRUEBA vs Real\">\n    <div class=\"section-head\">\n      <span class=\"section-num\">12<\u002Fspan>\n      <div>\n        <h2>Modo PRUEBA vs Modo Real<\u002Fh2>\n        <div class=\"sec-kicker\">REAL descuenta MP y suma PT. PRUEBA no afecta inventario.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"cards two\">\n      <div class=\"def-card accent-amber\">\n        <div class=\"dc-top\"><span class=\"dc-title\">12.1 Cuándo usar PRUEBA<\u002Fspan><\u002Fdiv>\n        <div class=\"dc-desc\" style=\"line-height:1.6\">· Validando una fórmula nueva antes de producir en serie.<br>· Capacitando a alguien sin descontar MP.<br>· Haciendo una muestra para un cliente.<br>· Probando el sistema (navegación, flujo, botones).<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"def-card accent-green\">\n        <div class=\"dc-top\"><span class=\"dc-title\">12.2 Cuándo NO usar PRUEBA<\u002Fspan><\u002Fdiv>\n        <div class=\"dc-desc\" style=\"line-height:1.6\">· Cuando es producción para vender al cliente.<br>· Cuando es para stock interno de Terán.<br>· Cuando es para reponer un pedido normal.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 12.3 Cómo se marca PRUEBA<\u002Fh3>\n    <p class=\"lead tight\">PRUEBA se marca en el <strong>pedido<\u002Fstrong> que crea Josué. Si el pedido es PRUEBA, la orden y el lote se crean también como PRUEBA automáticamente — no puedes cambiarlo a mitad del flujo.<\u002Fp>\n    <div class=\"callout callout--ojo\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"><\u002Fpath><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"><\u002Fline><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"><\u002Fline><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">OJO — <\u002Fspan>Si una “prueba” salió tan bien que el cliente la quiere comprar, NO la entregues marcada como prueba. Avisa a Emmanuel para convertirla a producción real (descuenta MP retroactivamente y suma PT).<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 12.4 Cómo identificar visualmente<\u002Fh3>\n    <div class=\"cards two\">\n      <div class=\"m-card prueba\" style=\"margin:0\">\n        <div class=\"m-row\"><span class=\"m-code\">PED-1039<\u002Fspan><span class=\"m-badge b-amber\">🦜 PRUEBA<\u002Fspan><\u002Fdiv>\n        <div class=\"m-title\" style=\"margin-top:5px\">Pedidos y órdenes PRUEBA<\u002Fdiv>\n        <div class=\"m-sub\">Fondo ámbar con borde naranja a la izquierda. Badge “PRUEBA”.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"m-card solid-card\" style=\"margin:0\">\n        <div class=\"m-row\"><span class=\"m-code\">PED-1042<\u002Fspan><span class=\"m-badge b-green\">Aceptado<\u002Fspan><\u002Fdiv>\n        <div class=\"m-title\" style=\"margin-top:5px\">Pedidos y órdenes REAL<\u002Fdiv>\n        <div class=\"m-sub\">Fondo blanco normal. Sin badge especial.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ════════════════════ 13. ERRORES ════════════════════ -->\n  <section class=\"section\" id=\"sec13\" data-screen-label=\"13 Errores comunes\">\n    <div class=\"section-head\">\n      <span class=\"section-num\">13<\u002Fspan>\n      <div>\n        <h2>Errores comunes y soluciones<\u002Fh2>\n        <div class=\"sec-kicker\">Cada uno incluye el mensaje exacto que verás en pantalla, la causa y cómo resolverlo.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 13.1 Errores de sesión<\u002Fh3>\n    <div class=\"err-card\">\n      <div class=\"err-msg\"><span class=\"em-label\">Mensaje<\u002Fspan><span class=\"em-text\">Sesión requerida / expirada<\u002Fspan><\u002Fdiv>\n      <div class=\"err-body\">\n        <div class=\"err-cell cause\"><div class=\"ec-k\">Causa<\u002Fdiv><div class=\"ec-v\">Pasaron más de 8 horas sin actividad o cerraste sesión en otro dispositivo.<\u002Fdiv><\u002Fdiv>\n        <div class=\"err-cell fix\"><div class=\"ec-k\">Solución<\u002Fdiv><div class=\"ec-v\">Vuelve a iniciar sesión con tu PIN. No pierdes datos: los checkpoints del wizard sobreviven.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"err-card\">\n      <div class=\"err-msg\"><span class=\"em-label\">Mensaje<\u002Fspan><span class=\"em-text\">Acceso fuera de horario laboral<\u002Fspan><\u002Fdiv>\n      <div class=\"err-body\">\n        <div class=\"err-cell cause\"><div class=\"ec-k\">Causa<\u002Fdiv><div class=\"ec-v\">Tu usuario tiene restricción de horario y estás intentando entrar fuera de tu turno.<\u002Fdiv><\u002Fdiv>\n        <div class=\"err-cell fix\"><div class=\"ec-k\">Solución<\u002Fdiv><div class=\"ec-v\">Espera al inicio de tu turno o pide a Emmanuel que te abra acceso temporalmente.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 13.2 Errores de inventario<\u002Fh3>\n    <div class=\"err-card\">\n      <div class=\"err-msg\"><span class=\"em-label\">Mensaje<\u002Fspan><span class=\"em-text\">Stock insuficiente / Faltan X kg de Y<\u002Fspan><\u002Fdiv>\n      <div class=\"err-body\">\n        <div class=\"err-cell cause\"><div class=\"ec-k\">Causa<\u002Fdiv><div class=\"ec-v\">No hay suficiente MP libre (descontando reservas de otras órdenes).<\u002Fdiv><\u002Fdiv>\n        <div class=\"err-cell fix\"><div class=\"ec-k\">Solución<\u002Fdiv><div class=\"ec-v\">Crea solicitud OC a Arely (sección 8). NO inicies producción aunque te deje crear la orden.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"err-card\">\n      <div class=\"err-msg\"><span class=\"em-label\">Mensaje<\u002Fspan><span class=\"em-text\">MP “XYZ” no existe en el maestro<\u002Fspan><\u002Fdiv>\n      <div class=\"err-body\">\n        <div class=\"err-cell cause\"><div class=\"ec-k\">Causa<\u002Fdiv><div class=\"ec-v\">Intentaste recibir o ajustar una MP con un nombre que no está en el catálogo.<\u002Fdiv><\u002Fdiv>\n        <div class=\"err-cell fix\"><div class=\"ec-k\">Solución<\u002Fdiv><div class=\"ec-v\">Verifica el nombre exacto (mayúsculas, espacios). Si es nueva, pide a Arely que la cree primero.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"err-card\">\n      <div class=\"err-msg\"><span class=\"em-label\">Mensaje<\u002Fspan><span class=\"em-text\">Código incorrecto. Verifica tu Authenticator<\u002Fspan><\u002Fdiv>\n      <div class=\"err-body\">\n        <div class=\"err-cell cause\"><div class=\"ec-k\">Causa<\u002Fdiv><div class=\"ec-v\">El código de autorización que ingresaste no es válido.<\u002Fdiv><\u002Fdiv>\n        <div class=\"err-cell fix\"><div class=\"ec-k\">Solución<\u002Fdiv><div class=\"ec-v\">Si usas Google Authenticator, el código cambia cada 30s: espera al siguiente. Si usas el universal, pide a Emmanuel que te lo recuerde.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 13.3 Errores de producción<\u002Fh3>\n    <div class=\"err-card\">\n      <div class=\"err-msg\"><span class=\"em-label\">Mensaje<\u002Fspan><span class=\"em-text\">Orden no encontrada (posiblemente eliminada)<\u002Fspan><\u002Fdiv>\n      <div class=\"err-body\">\n        <div class=\"err-cell cause\"><div class=\"ec-k\">Causa<\u002Fdiv><div class=\"ec-v\">La orden fue eliminada por admin entre tu carga inicial y el momento del clic.<\u002Fdiv><\u002Fdiv>\n        <div class=\"err-cell fix\"><div class=\"ec-k\">Solución<\u002Fdiv><div class=\"ec-v\">Refresca (jala hacia abajo en celular). Si ya no aparece, pide aclaración a Emmanuel.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"err-card\">\n      <div class=\"err-msg\"><span class=\"em-label\">Mensaje<\u002Fspan><span class=\"em-text\">esPrueba=true requiere orden/pedido marcado como prueba<\u002Fspan><\u002Fdiv>\n      <div class=\"err-body\">\n        <div class=\"err-cell cause\"><div class=\"ec-k\">Causa<\u002Fdiv><div class=\"ec-v\">Intentaste forzar prueba en una orden que NO es prueba en el origen.<\u002Fdiv><\u002Fdiv>\n        <div class=\"err-cell fix\"><div class=\"ec-k\">Solución<\u002Fdiv><div class=\"ec-v\">No puedes cambiar prueba/real a mitad del flujo. Pide a Josué que cree el pedido marcado como prueba desde el inicio.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 13.4 Errores de envasado<\u002Fh3>\n    <div class=\"err-card\">\n      <div class=\"err-msg\"><span class=\"em-label\">Mensaje<\u002Fspan><span class=\"em-text\">No hay litros restantes para registrar merma<\u002Fspan><\u002Fdiv>\n      <div class=\"err-body\">\n        <div class=\"err-cell cause\"><div class=\"ec-k\">Causa<\u002Fdiv><div class=\"ec-v\">Intentaste cerrar un lote que ya completó el 100% de envasado.<\u002Fdiv><\u002Fdiv>\n        <div class=\"err-cell fix\"><div class=\"ec-k\">Solución<\u002Fdiv><div class=\"ec-v\">No es necesario cerrarlo: ya se cerró solo al completar los litros. Verifica el estado del lote.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"err-card\">\n      <div class=\"err-msg\"><span class=\"em-label\">Mensaje<\u002Fspan><span class=\"em-text\">Stock insuficiente de envase / tapa<\u002Fspan><\u002Fdiv>\n      <div class=\"err-body\">\n        <div class=\"err-cell cause\"><div class=\"ec-k\">Causa<\u002Fdiv><div class=\"ec-v\">No hay suficientes envases o tapas para la cantidad que quieres registrar.<\u002Fdiv><\u002Fdiv>\n        <div class=\"err-cell fix\"><div class=\"ec-k\">Solución<\u002Fdiv><div class=\"ec-v\">Reduce la cantidad en este sublote, o pide a Arely más envases/tapas a Menvaplastic/Centrus.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"err-card\">\n      <div class=\"err-msg\"><span class=\"em-label\">Mensaje<\u002Fspan><span class=\"em-text\">Ningún sublote fue transferido<\u002Fspan><\u002Fdiv>\n      <div class=\"err-body\">\n        <div class=\"err-cell cause\"><div class=\"ec-k\">Causa<\u002Fdiv><div class=\"ec-v\">Los códigos de sublote que enviaste no existen en el lote o ya están en Terán.<\u002Fdiv><\u002Fdiv>\n        <div class=\"err-cell fix\"><div class=\"ec-k\">Solución<\u002Fdiv><div class=\"ec-v\">Refresca y verifica el estado real de los sublotes antes de transferir.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 13.5 Errores generales<\u002Fh3>\n    <div class=\"err-card\">\n      <div class=\"err-msg\"><span class=\"em-label\">Mensaje<\u002Fspan><span class=\"em-text\">Error: Internal Server Error / HTTP 500<\u002Fspan><\u002Fdiv>\n      <div class=\"err-body\">\n        <div class=\"err-cell cause\"><div class=\"ec-k\">Causa<\u002Fdiv><div class=\"ec-v\">Falla del servidor (poco frecuente).<\u002Fdiv><\u002Fdiv>\n        <div class=\"err-cell fix\"><div class=\"ec-k\">Solución<\u002Fdiv><div class=\"ec-v\">Espera 30 segundos y reintenta. Si persiste, avisa a Emmanuel con captura de pantalla.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"err-card\">\n      <div class=\"err-msg\"><span class=\"em-label\">Mensaje<\u002Fspan><span class=\"em-text\">Failed to fetch / Sin conexión<\u002Fspan><\u002Fdiv>\n      <div class=\"err-body\">\n        <div class=\"err-cell cause\"><div class=\"ec-k\">Causa<\u002Fdiv><div class=\"ec-v\">Perdiste WiFi o datos móviles.<\u002Fdiv><\u002Fdiv>\n        <div class=\"err-cell fix\"><div class=\"ec-k\">Solución<\u002Fdiv><div class=\"ec-v\">Verifica tu conexión. Tus checkpoints del wizard están guardados, no pierdes nada.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ════════════════════ 14. BUENAS PRÁCTICAS ════════════════════ -->\n  <section class=\"section\" id=\"sec14\" data-screen-label=\"14 Buenas prácticas\">\n    <div class=\"section-head\">\n      <span class=\"section-num\">14<\u002Fspan>\n      <div>\n        <h2>Buenas prácticas<\u002Fh2>\n        <div class=\"sec-kicker\">Rutinas que te ahorran problemas y mantienen la trazabilidad limpia.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 14.1 Antes de empezar tu turno<\u002Fh3>\n    <ul class=\"checklist\">\n      <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span>Revisa el <strong>Dashboard<\u002Fstrong>: cuántos pedidos hay, cuántos lotes en QC, alertas.<\u002Fspan><\u002Fli>\n      <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span>Verifica que tu <strong>Authenticator<\u002Fstrong> funcione (que cambie el código cada 30s).<\u002Fspan><\u002Fli>\n      <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span>Ten cargador a mano — el wizard requiere conexión.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 14.2 Durante producción<\u002Fh3>\n    <ul class=\"checklist\">\n      <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span>Sigue el wizard paso a paso. No te saltes pasos aunque “te sepas la fórmula de memoria”.<\u002Fspan><\u002Fli>\n      <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span>Cuando agregues MP extra (espesante, agua, TiO₂), <strong>regístralo en Ajustes<\u002Fstrong>. No lo dejes pasar.<\u002Fspan><\u002Fli>\n      <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span>Mide el QC con los equipos correctos (viscosímetro, pH-metro, copa de gravedad). No “estimes a ojo”.<\u002Fspan><\u002Fli>\n      <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span>Si el QC sale fuera de rango, NO mientas con el valor para avanzar. El sistema bloquea por seguridad.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 14.3 Al terminar tu turno<\u002Fh3>\n    <ul class=\"checklist\">\n      <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span>Termina los wizards abiertos. Si no puedes, los checkpoints quedan guardados.<\u002Fspan><\u002Fli>\n      <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span>Transfiere a Terán los sublotes que ya están listos.<\u002Fspan><\u002Fli>\n      <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span>Imprime y pega los QR de las cubetas envasadas.<\u002Fspan><\u002Fli>\n      <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span><strong>Cierra sesión<\u002Fstrong> (botón en tu avatar arriba).<\u002Fspan><\u002Fli>\n    <\u002Ful>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 14.4 Seguridad<\u002Fh3>\n    <ul class=\"checklist\">\n      <li><span class=\"ck\" style=\"background:var(--red-bg);color:var(--red-fg)\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5l-8-3z\"><\u002Fpath><\u002Fsvg><\u002Fspan><span>No compartas tu PIN. Si alguien lo sabe, avisa a Emmanuel para cambiarlo.<\u002Fspan><\u002Fli>\n      <li><span class=\"ck\" style=\"background:var(--red-bg);color:var(--red-fg)\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5l-8-3z\"><\u002Fpath><\u002Fsvg><\u002Fspan><span>No compartas el código universal admin por WhatsApp ni SMS.<\u002Fspan><\u002Fli>\n      <li><span class=\"ck\" style=\"background:var(--red-bg);color:var(--red-fg)\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5l-8-3z\"><\u002Fpath><\u002Fsvg><\u002Fspan><span>Si encuentras la tablet/celular abierto con la sesión de otro, ciérrala y avisa.<\u002Fspan><\u002Fli>\n      <li><span class=\"ck\" style=\"background:var(--red-bg);color:var(--red-fg)\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5l-8-3z\"><\u002Fpath><\u002Fsvg><\u002Fspan><span>Si ves un comportamiento raro (botones que no responden, datos viejos), reporta a Emmanuel con captura.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <!-- ════════════════════ 15. CONTACTOS ════════════════════ -->\n  <section class=\"section\" id=\"sec15\" data-screen-label=\"15 Contactos\">\n    <div class=\"section-head\">\n      <span class=\"section-num\">15<\u002Fspan>\n      <div>\n        <h2>Contactos<\u002Fh2>\n        <div class=\"sec-kicker\">A quién acudir según el tema.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"contacts\">\n      <div class=\"contact\"><span class=\"ct-av\" style=\"background:var(--green)\">Em<\u002Fspan><div><div class=\"ct-name\">Emmanuel<\u002Fdiv><div class=\"ct-role\">Admin / dueño<\u002Fdiv><div class=\"ct-desc\">Soporte del sistema, códigos de autorización, alta/baja de usuarios, decisiones operativas.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"contact\"><span class=\"ct-av\" style=\"background:#6d4bb0\">Jo<\u002Fspan><div><div class=\"ct-name\">Josué<\u002Fdiv><div class=\"ct-role\">Almacén Terán<\u002Fdiv><div class=\"ct-desc\">Pedidos, recepción de PT en Terán, devoluciones.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"contact\"><span class=\"ct-av\" style=\"background:#1e62c9\">Lu<\u002Fspan><div><div class=\"ct-name\">Luis Lara<\u002Fdiv><div class=\"ct-role\">Recolector<\u002Fdiv><div class=\"ct-desc\">Recolección de sublotes desde fábrica, transporte a Terán.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"contact\"><span class=\"ct-av\" style=\"background:#d97706\">Ar<\u002Fspan><div><div class=\"ct-name\">Arely<\u002Fdiv><div class=\"ct-role\">Compras<\u002Fdiv><div class=\"ct-desc\">Solicitudes OC MP, recepciones de proveedor, costos.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"contact\"><span class=\"ct-av\" style=\"background:#c0392b\">Bu<\u002Fspan><div><div class=\"ct-name\">Burgos<\u002Fdiv><div class=\"ct-role\">Inventario<\u002Fdiv><div class=\"ct-desc\">Cycle counts, varianzas, auditoría de stock.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"callout callout--info\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"><\u002Fline><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">INFO — <\u002Fspan>Si tienes una duda que este manual no resuelve, pregunta a Emmanuel ANTES de improvisar. Una acción mal registrada se propaga a inventario, reportes y trazabilidad: corregirla después cuesta más que pedir ayuda al inicio.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"doc-foot\">\n      <span>Pinturas El Perico · Manual del Técnico · Enrique<\u002Fspan>\n      <a href=\"#indice\">↑ Volver al índice<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fmain>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
