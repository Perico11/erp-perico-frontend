document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"es-MX\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Manual del Técnico — Pinturas El Perico<\u002Ftitle>\n<style>/* ══════════════════════════════════════════════════════════════\n   Manual del Técnico — Pinturas El Perico\n   Hoja de estilos. Sistema visual: liquid glass, verde bosque,\n   DM Sans. Pensado para leer en celular en planta + imprimir/PDF.\n   ══════════════════════════════════════════════════════════════ */\n\n@font-face {\n  font-family: 'DM Sans';\n  src: url(\"f5d88731-41c8-48ab-9e87-eeb3ab98a8a9\") format('truetype-variations');\n  font-weight: 100 1000;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root {\n  --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n\n  /* Brand */\n  --green: #0f7a5a;\n  --green-deep: #0b5b43;\n  --green-ink: #064e3b;\n  --green-a06: color-mix(in srgb, var(--green) 6%, transparent);\n  --green-a10: color-mix(in srgb, var(--green) 10%, transparent);\n  --green-a14: color-mix(in srgb, var(--green) 14%, transparent);\n  --green-a20: color-mix(in srgb, var(--green) 20%, transparent);\n  --green-a30: color-mix(in srgb, var(--green) 30%, transparent);\n\n  /* Surfaces */\n  --bg: #c8d8d4;\n  --bg-gradient: linear-gradient(140deg, #cddbd6 0%, #bdd0c9 22%, #acc4ba 45%, #9fbcb1 68%, #93b4a8 100%);\n  --paper: #fbfdfc;\n  --paper-soft: #f4f8f6;\n  --ink: #0d2320;\n  --ink2: #3d5a4a;\n  --ink3: #6b8a78;\n\n  /* Status / callouts */\n  --blue: #1e62c9;       --blue-bg: #e7f0fb;   --blue-fg: #1e3a8a;\n  --amber: #d97706;      --amber-bg: #fdf0dd;  --amber-fg: #92500a;\n  --red: #c0392b;        --red-bg: #fbe9e7;    --red-fg: #962019;\n  --okgreen-bg: #e1f3ec; --okgreen-fg: #0b5b43;\n  --gray-bg: #eceeed;    --gray-fg: #44524c;\n  --purple: #6d4bb0;     --purple-bg: #efeafa; --purple-fg: #4a2f86;\n\n  /* Radius */\n  --r-xs: 8px; --r-sm: 10px; --r-md: 14px; --r: 16px; --r-lg: 24px; --r-pill: 99px;\n\n  /* Shadow */\n  --sh-card: 0 2px 14px rgba(20,70,52,.07), 0 1px 3px rgba(20,70,52,.04);\n  --sh-soft: 0 1px 4px rgba(0,0,0,.05);\n  --sh-lg: 0 24px 60px rgba(15,60,44,.18);\n  --border-glass: rgba(255,255,255,.6);\n  --border: rgba(13,35,32,.08);\n\n  --t: 240ms cubic-bezier(.22,1,.36,1);\n}\n\n* { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-sans);\n  color: var(--ink);\n  background: var(--bg-gradient) fixed;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  letter-spacing: -.006em;\n  line-height: 1.55;\n}\n\n/* Ambient blobs behind the document (screen only) */\n.bg-blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }\n.bg-blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .5; }\n.bg-blob.b1 { width: 520px; height: 520px; top: -120px; left: -100px; background: radial-gradient(circle, #1d9e75, transparent 68%); }\n.bg-blob.b2 { width: 480px; height: 480px; bottom: -140px; right: -120px; background: radial-gradient(circle, #6fae9a, transparent 70%); }\n.bg-blob.b3 { width: 420px; height: 420px; top: 40%; right: 10%; background: radial-gradient(circle, #d8c98f, transparent 72%); opacity: .35; }\n\n/* ── Document column ───────────────────────────────────────────── */\n.doc {\n  position: relative;\n  z-index: 1;\n  max-width: 840px;\n  margin: 0 auto;\n  padding: 40px 22px 80px;\n}\n\n@media (max-width: 600px) {\n  .doc { padding: 18px 14px 56px; }\n}\n\n/* ── Type ramp ─────────────────────────────────────────────────── */\nh1,h2,h3,h4 { margin: 0; font-weight: 500; letter-spacing: -.02em; line-height: 1.14; }\np { margin: 0; }\na { color: var(--green-deep); }\n\n.eyebrow {\n  font-size: 12px; font-weight: 500; letter-spacing: .14em;\n  text-transform: uppercase; color: var(--green-deep);\n}\n\n/* ══════════════════════════════════════════════════════════════\n   COVER\n   ══════════════════════════════════════════════════════════════ */\n.cover {\n  position: relative; z-index: 1;\n  min-height: 100vh;\n  display: flex; flex-direction: column; justify-content: center;\n  max-width: 840px; margin: 0 auto; padding: 48px 26px;\n}\n.cover-logo { width: 76px; height: auto; margin-bottom: 30px; }\n.cover-brand { font-size: 13px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--green-deep); margin-bottom: 22px; }\n.cover h1 {\n  font-size: clamp(46px, 12vw, 92px);\n  line-height: .94; letter-spacing: -.035em; font-weight: 500;\n  color: var(--ink);\n}\n.cover h1 .thin { color: var(--ink3); }\n.cover-sub { font-size: clamp(17px, 4.4vw, 22px); color: var(--ink2); margin-top: 22px; max-width: 30ch; }\n\n.cover-meta {\n  margin-top: 44px;\n  display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px;\n  max-width: 520px;\n}\n.meta-card {\n  background: rgba(251,253,252,.66);\n  backdrop-filter: blur(20px) saturate(1.1);\n  -webkit-backdrop-filter: blur(20px) saturate(1.1);\n  border: 1px solid var(--border-glass);\n  border-radius: var(--r-md);\n  box-shadow: var(--sh-card);\n  padding: 14px 16px;\n}\n.meta-card .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); }\n.meta-card .v { font-size: 19px; font-weight: 500; color: var(--ink); margin-top: 3px; word-break: break-word; }\n.meta-card .v.small { font-size: 14px; }\n.cover-foot { margin-top: 40px; font-size: 13px; color: var(--ink3); }\n\n/* ══════════════════════════════════════════════════════════════\n   ÍNDICE\n   ══════════════════════════════════════════════════════════════ */\n.toc { margin-top: 8px; }\n.toc-list { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 6px; }\n.toc-list > li > a {\n  display: flex; align-items: baseline; gap: 14px;\n  padding: 12px 16px; border-radius: var(--r-sm);\n  text-decoration: none; color: var(--ink);\n  background: rgba(251,253,252,.5);\n  border: 1px solid transparent;\n  transition: background var(--t), border-color var(--t), transform var(--t);\n}\n.toc-list > li > a:hover { background: var(--paper); border-color: var(--border-glass); transform: translateX(3px); }\n.toc-num { font-size: 14px; font-weight: 500; color: var(--green-deep); min-width: 26px; }\n.toc-title { font-size: 16px; font-weight: 500; flex: 1; }\n.toc-sub { font-size: 13px; color: var(--ink3); }\n\n/* ══════════════════════════════════════════════════════════════\n   SECTIONS\n   ══════════════════════════════════════════════════════════════ */\n.section { padding-top: 30px; margin-top: 30px; }\n.section + .section { border-top: 1px solid rgba(13,35,32,.1); }\n\n.section-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 6px; }\n.section-num {\n  flex: none;\n  display: inline-flex; align-items: center; justify-content: center;\n  width: 46px; height: 46px; border-radius: 13px;\n  background: var(--green); color: #fff;\n  font-size: 20px; font-weight: 500; letter-spacing: -.02em;\n  box-shadow: 0 4px 14px var(--green-a30);\n}\n.section-head h2 { font-size: clamp(26px, 6vw, 34px); padding-top: 4px; }\n.section-head .sec-kicker { font-size: 13px; color: var(--ink3); margin-top: 2px; }\n\n.subhead { font-size: 19px; font-weight: 500; margin: 28px 0 10px; letter-spacing: -.02em; }\n.subhead .dot { color: var(--green); }\n.lead { font-size: 15.5px; color: var(--ink2); margin: 8px 0 0; max-width: 64ch; }\n.lead.tight { margin-top: 4px; }\n\n/* ── Step cards ────────────────────────────────────────────────── */\n.steps { list-style: none; counter-reset: step; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }\n.steps > li {\n  position: relative; counter-increment: step;\n  display: flex; gap: 14px; align-items: flex-start;\n  background: var(--paper);\n  border: 1px solid var(--border);\n  border-radius: var(--r-md);\n  padding: 13px 16px 13px 14px;\n  box-shadow: var(--sh-soft);\n}\n.steps > li::before {\n  content: counter(step);\n  flex: none;\n  display: inline-flex; align-items: center; justify-content: center;\n  width: 28px; height: 28px; border-radius: 50%;\n  background: var(--green-a10); color: var(--green-deep);\n  font-size: 14px; font-weight: 500;\n  margin-top: 1px;\n}\n.steps > li .step-body { font-size: 15px; color: var(--ink); padding-top: 3px; }\n.steps > li .step-body strong { font-weight: 500; color: var(--green-deep); }\n.steps.compact > li { padding: 10px 14px; }\n\n/* numbered as plain emphasis in flowing text */\n.kbd, .ui {\n  font-weight: 500; color: var(--green-deep);\n  background: var(--green-a10); padding: 1px 7px; border-radius: var(--r-pill);\n  font-size: .94em; white-space: nowrap;\n}\n.path { font-weight: 500; color: var(--ink); }\n.path .arrow { color: var(--ink3); margin: 0 3px; }\n\n/* ── Callouts ──────────────────────────────────────────────────── */\n.callout {\n  display: flex; gap: 12px; align-items: flex-start;\n  padding: 13px 16px; border-radius: var(--r-md);\n  margin: 14px 0 0; font-size: 14.5px; line-height: 1.5;\n  border: 1px solid transparent;\n}\n.callout .ico { flex: none; width: 22px; height: 22px; margin-top: 1px; }\n.callout . co-body { color: var(--ink); }\n.callout .co-tag { font-weight: 500; letter-spacing: .02em; }\n\n.callout--tip   { background: var(--okgreen-bg); border-color: color-mix(in srgb, var(--green) 22%, transparent); }\n.callout--tip .co-tag, .callout--tip .ico { color: var(--green-deep); }\n.callout--info  { background: var(--blue-bg); border-color: color-mix(in srgb, var(--blue) 22%, transparent); }\n.callout--info .co-tag, .callout--info .ico { color: var(--blue); }\n.callout--ojo   { background: var(--amber-bg); border-color: color-mix(in srgb, var(--amber) 30%, transparent); }\n.callout--ojo .co-tag, .callout--ojo .ico { color: var(--amber-fg); }\n.callout--evitar{ background: var(--red-bg); border-color: color-mix(in srgb, var(--red) 28%, transparent); }\n.callout--evitar .co-tag, .callout--evitar .ico { color: var(--red-fg); }\n\n/* ── Badges / chips ────────────────────────────────────────────── */\n.badge {\n  display: inline-flex; align-items: center; gap: 5px;\n  padding: 4px 11px; border-radius: var(--r-pill);\n  font-size: 12.5px; font-weight: 500; letter-spacing: .01em; white-space: nowrap;\n}\n.badge .d { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }\n.b-green  { background: var(--okgreen-bg); color: var(--okgreen-fg); }\n.b-amber  { background: var(--amber-bg);   color: var(--amber-fg); }\n.b-red    { background: var(--red-bg);     color: var(--red-fg); }\n.b-blue   { background: var(--blue-bg);    color: var(--blue-fg); }\n.b-gray   { background: var(--gray-bg);    color: var(--gray-fg); }\n.b-purple { background: var(--purple-bg);  color: var(--purple-fg); }\n\n/* ── Definition / option cards (for \"tres resultados\", ejemplos, etc.) ── */\n.cards { display: grid; gap: 10px; margin-top: 14px; }\n.cards.two { grid-template-columns: repeat(2, minmax(0,1fr)); }\n.cards.three { grid-template-columns: repeat(3, minmax(0,1fr)); }\n@media (max-width: 560px) { .cards.two, .cards.three { grid-template-columns: 1fr; } }\n\n.def-card {\n  background: var(--paper); border: 1px solid var(--border);\n  border-radius: var(--r-md); padding: 14px 16px; box-shadow: var(--sh-soft);\n}\n.def-card .dc-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }\n.def-card .dc-title { font-size: 14.5px; font-weight: 500; }\n.def-card .dc-desc { font-size: 13.5px; color: var(--ink2); line-height: 1.45; }\n.def-card.accent-green  { border-left: 3px solid var(--green); }\n.def-card.accent-red    { border-left: 3px solid var(--red); }\n.def-card.accent-amber  { border-left: 3px solid var(--amber); }\n.def-card.accent-blue   { border-left: 3px solid var(--blue); }\n.def-card.accent-gray   { border-left: 3px solid #aab6b1; }\n\n/* ── Pantallas (screen reference list, section 2) ─────────────── */\n.screens-list { display: grid; gap: 8px; margin-top: 16px; }\n.screen-row {\n  display: flex; gap: 14px; align-items: flex-start;\n  background: var(--paper); border: 1px solid var(--border);\n  border-radius: var(--r-md); padding: 13px 16px; box-shadow: var(--sh-soft);\n}\n.screen-row .sr-ico {\n  flex: none; width: 38px; height: 38px; border-radius: 11px;\n  background: var(--green-a10); color: var(--green-deep);\n  display: grid; place-items: center;\n}\n.screen-row .sr-ico svg { width: 21px; height: 21px; }\n.screen-row .sr-name { font-size: 15px; font-weight: 500; }\n.screen-row .sr-desc { font-size: 13.5px; color: var(--ink2); margin-top: 1px; line-height: 1.45; }\n\n/* ══════════════════════════════════════════════════════════════\n   FLOW DIAGRAM (section 3)\n   ══════════════════════════════════════════════════════════════ */\n.flow { display: grid; gap: 0; margin-top: 18px; position: relative; }\n.flow-step {\n  display: flex; gap: 16px; align-items: flex-start;\n  padding: 4px 0;\n}\n.flow-rail { flex: none; display: flex; flex-direction: column; align-items: center; }\n.flow-node {\n  width: 38px; height: 38px; border-radius: 50%;\n  background: var(--green); color: #fff;\n  display: grid; place-items: center; font-size: 16px; font-weight: 500;\n  box-shadow: 0 3px 10px var(--green-a30); z-index: 1;\n}\n.flow-line { width: 2px; flex: 1; min-height: 26px; background: var(--green-a30); }\n.flow-step:last-child .flow-line { display: none; }\n.flow-card {\n  flex: 1; margin-bottom: 12px;\n  background: var(--paper); border: 1px solid var(--border);\n  border-radius: var(--r-md); padding: 12px 16px; box-shadow: var(--sh-soft);\n}\n.flow-card .fc-who { font-size: 12px; font-weight: 500; color: var(--green-deep); letter-spacing: .02em; }\n.flow-card .fc-text { font-size: 14.5px; color: var(--ink); margin-top: 2px; }\n.flow-card .fc-text strong { font-weight: 500; color: var(--green-deep); }\n\n/* ══════════════════════════════════════════════════════════════\n   PHONE MOCKUPS\n   ══════════════════════════════════════════════════════════════ */\n.mock-wrap {\n  display: flex; gap: 24px; align-items: center; flex-wrap: wrap;\n  margin-top: 18px;\n}\n.mock-wrap .mock-note { flex: 1; min-width: 200px; font-size: 14px; color: var(--ink2); }\n.mock-wrap .mock-note h4 { font-size: 15px; margin-bottom: 6px; }\n\n.phone {\n  flex: none;\n  width: 248px;\n  background: #0d2320;\n  border-radius: 36px;\n  padding: 9px;\n  box-shadow: var(--sh-lg);\n  position: relative;\n}\n.phone::before {\n  content: ''; position: absolute; top: 16px; left: 50%; transform: translateX(-50%);\n  width: 84px; height: 5px; border-radius: 99px; background: rgba(255,255,255,.22); z-index: 5;\n}\n.phone-screen {\n  border-radius: 28px; overflow: hidden;\n  background: var(--bg-gradient);\n  height: 510px; position: relative;\n  display: flex; flex-direction: column;\n}\n.ps-status {\n  display: flex; justify-content: space-between; align-items: center;\n  padding: 13px 18px 6px; font-size: 11px; font-weight: 500; color: var(--ink);\n}\n.ps-status .dots { display: flex; gap: 3px; align-items: center; }\n.ps-body { flex: 1; overflow: hidden; padding: 6px 12px 12px; }\n.ps-appbar { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 12px; }\n.ps-appbar .ab-title { font-size: 17px; font-weight: 500; }\n.ps-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--green); color:#fff; display: grid; place-items: center; font-size: 12px; font-weight: 500; }\n\n/* glass mini cards inside mockups */\n.m-card {\n  background: rgba(251,253,252,.7);\n  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);\n  border: 1px solid var(--border-glass);\n  border-radius: 14px; padding: 11px 12px; box-shadow: var(--sh-card);\n  margin-bottom: 8px;\n}\n.m-card.solid-card { background: #fff; }\n.m-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }\n.m-title { font-size: 13px; font-weight: 500; color: var(--ink); }\n.m-sub { font-size: 11px; color: var(--ink3); margin-top: 2px; }\n.m-code { font-size: 10.5px; color: var(--ink3); font-weight: 500; letter-spacing: .03em; }\n.m-badge { font-size: 10px; padding: 2px 8px; border-radius: 99px; font-weight: 500; }\n.m-pill-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }\n.m-btn { font-size: 11.5px; font-weight: 500; padding: 7px 14px; border-radius: 99px; background: var(--green); color: #fff; text-align: center; }\n.m-btn.ghost { background: var(--green-a10); color: var(--green-deep); }\n.m-prog { height: 6px; border-radius: 99px; background: var(--green-a10); overflow: hidden; margin-top: 8px; }\n.m-prog > i { display: block; height: 100%; background: var(--green); border-radius: 99px; }\n\n/* bottom nav in mock */\n.ps-nav {\n  display: flex; justify-content: space-around; align-items: center;\n  padding: 9px 6px calc(9px + env(safe-area-inset-bottom));\n  background: rgba(255,255,255,.82);\n  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);\n  border-top: 1px solid var(--border);\n}\n.ps-nav .nav-i { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink3); font-size: 9px; font-weight: 500; }\n.ps-nav .nav-i svg { width: 20px; height: 20px; }\n.ps-nav .nav-i.active { color: var(--green); }\n\n/* PRUEBA tinted row */\n.m-card.prueba { background: var(--amber-bg); border-left: 3px solid var(--amber); }\n\n/* login screen */\n.login-screen { justify-content: center; align-items: center; padding: 28px 22px; gap: 0; }\n.login-logo { width: 54px; margin-bottom: 18px; }\n.login-title { font-size: 19px; font-weight: 500; text-align: center; }\n.login-sub { font-size: 12px; color: var(--ink3); text-align: center; margin-top: 4px; margin-bottom: 22px; }\n.user-pill {\n  width: 100%; background: #fff; border: 1px solid var(--border); border-radius: 14px;\n  padding: 11px 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 10px;\n}\n.user-pill.sel { border-color: var(--green); background: var(--green-a06); box-shadow: 0 0 0 3px var(--green-a10); }\n.user-pill .up-av { width: 32px; height: 32px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 500; }\n.user-pill .up-name { font-size: 14px; font-weight: 500; }\n.user-pill .up-role { font-size: 11px; color: var(--ink3); }\n.pin-dots { display: flex; gap: 12px; justify-content: center; margin: 18px 0; }\n.pin-dots i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--green); }\n.pin-dots i.on { background: var(--green); }\n\n/* wizard step UI */\n.wiz-steps { display: flex; gap: 5px; margin-bottom: 12px; }\n.wiz-steps i { flex: 1; height: 4px; border-radius: 99px; background: var(--green-a10); }\n.wiz-steps i.on { background: var(--green); }\n.wiz-steps i.done { background: var(--green); opacity: .55; }\n.timer-ring { display: flex; flex-direction: column; align-items: center; padding: 6px 0 10px; }\n.timer-ring .tr-time { font-size: 30px; font-weight: 500; color: var(--ink); letter-spacing: -.02em; }\n.timer-ring .tr-label { font-size: 11px; color: var(--ink3); }\n.mp-line { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px; }\n.mp-line:last-child { border-bottom: 0; }\n.mp-check { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--green-a30); flex: none; display: grid; place-items: center; }\n.mp-check.on { background: var(--green); border-color: var(--green); color: #fff; }\n.mp-check.on svg { width: 12px; height: 12px; }\n.mp-line .mp-name { flex: 1; color: var(--ink); }\n.mp-line .mp-qty { font-weight: 500; color: var(--ink2); }\n\n/* QC value chips */\n.qc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }\n.qc-chip { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 7px 9px; }\n.qc-chip .qc-k { font-size: 9.5px; color: var(--ink3); }\n.qc-chip .qc-v { font-size: 14px; font-weight: 500; color: var(--ink); }\n.qc-chip.ok { border-color: color-mix(in srgb, var(--green) 35%, transparent); }\n.qc-chip.ok .qc-v { color: var(--green-deep); }\n\n/* QR tag */\n.qr-box { width: 54px; height: 54px; border-radius: 8px; background:\n  conic-gradient(#0d2320 25%, #fff 0 50%, #0d2320 0 75%, #fff 0);\n  background-size: 12px 12px; border: 3px solid #fff; box-shadow: var(--sh-soft); }\n\n/* ══════════════════════════════════════════════════════════════\n   ERROR TABLE (section 13)\n   ══════════════════════════════════════════════════════════════ */\n.err-card {\n  background: var(--paper); border: 1px solid var(--border);\n  border-radius: var(--r-md); overflow: hidden; box-shadow: var(--sh-soft);\n  margin-top: 10px;\n}\n.err-msg {\n  display: flex; align-items: center; gap: 10px;\n  background: var(--red-bg); padding: 11px 16px;\n  border-bottom: 1px solid color-mix(in srgb, var(--red) 18%, transparent);\n}\n.err-msg .em-label { font-size: 10.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--red-fg); }\n.err-msg .em-text { font-size: 14px; font-weight: 500; color: var(--red-fg); font-family: ui-monospace, 'SF Mono', Menlo, monospace; }\n.err-body { display: grid; grid-template-columns: 1fr 1fr; }\n@media (max-width: 560px) { .err-body { grid-template-columns: 1fr; } }\n.err-cell { padding: 11px 16px; }\n.err-cell + .err-cell { border-left: 1px solid var(--border); }\n@media (max-width: 560px) { .err-cell + .err-cell { border-left: 0; border-top: 1px solid var(--border); } }\n.err-cell .ec-k { font-size: 10.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); margin-bottom: 3px; }\n.err-cell.cause .ec-k { color: var(--amber-fg); }\n.err-cell.fix .ec-k { color: var(--green-deep); }\n.err-cell .ec-v { font-size: 13.5px; color: var(--ink); line-height: 1.45; }\n\n/* ══════════════════════════════════════════════════════════════\n   CONTACTS (section 15)\n   ══════════════════════════════════════════════════════════════ */\n.contacts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }\n@media (max-width: 560px) { .contacts { grid-template-columns: 1fr; } }\n.contact {\n  display: flex; gap: 12px; align-items: flex-start;\n  background: var(--paper); border: 1px solid var(--border);\n  border-radius: var(--r-md); padding: 14px 16px; box-shadow: var(--sh-soft);\n}\n.contact .ct-av {\n  flex: none; width: 42px; height: 42px; border-radius: 50%;\n  display: grid; place-items: center; font-size: 16px; font-weight: 500; color: #fff;\n}\n.contact .ct-name { font-size: 15px; font-weight: 500; }\n.contact .ct-role { font-size: 11.5px; color: var(--green-deep); font-weight: 500; margin: 1px 0 3px; }\n.contact .ct-desc { font-size: 13px; color: var(--ink2); line-height: 1.4; }\n\n/* checklist (buenas prácticas) */\n.checklist { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 7px; }\n.checklist li {\n  display: flex; gap: 11px; align-items: flex-start; font-size: 15px;\n  background: var(--paper); border: 1px solid var(--border);\n  border-radius: var(--r-md); padding: 11px 15px; box-shadow: var(--sh-soft);\n}\n.checklist li .ck {\n  flex: none; width: 22px; height: 22px; border-radius: 7px; margin-top: 1px;\n  background: var(--green-a10); color: var(--green-deep);\n  display: grid; place-items: center;\n}\n.checklist li .ck svg { width: 14px; height: 14px; }\n.checklist li strong { font-weight: 500; color: var(--green-deep); }\n\n/* back-to-top divider footer */\n.doc-foot {\n  margin-top: 48px; padding-top: 22px; border-top: 1px solid rgba(13,35,32,.1);\n  display: flex; align-items: center; justify-content: space-between; gap: 14px;\n  font-size: 12.5px; color: var(--ink3); flex-wrap: wrap;\n}\n.doc-foot a { color: var(--green-deep); text-decoration: none; font-weight: 500; }\n\n/* small helpers */\n.mt0 { margin-top: 0; }\n.row-wrap { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }\n\n/* ══════════════════════════════════════════════════════════════\n   PRINT\n   ══════════════════════════════════════════════════════════════ */\n@media print {\n  @page { size: A4; margin: 14mm 12mm; }\n\n  /* Preserve every color/fill of the brand design in the PDF */\n  *, *::before, *::after {\n    -webkit-print-color-adjust: exact !important;\n    print-color-adjust: exact !important;\n  }\n  /* Keep the signature sage gradient on every page */\n  html { background: var(--bg-gradient) !important; }\n  body { background: transparent !important; }\n  /* Fixed blobs only paint on page 1 — drop them, the gradient carries the look */\n  .bg-blobs { display: none !important; }\n\n  /* backdrop-filter doesn't render in print — make glass surfaces honest */\n  .meta-card { background: rgba(251,253,252,.92) !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }\n  .m-card { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }\n  .ps-nav { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }\n\n  /* Softer shadows print cleaner */\n  .meta-card, .m-card, .def-card, .steps > li, .screen-row, .flow-card,\n  .err-card, .contact, .checklist li, .toc-list > li > a {\n    box-shadow: none !important;\n  }\n\n  .cover {\n    min-height: auto; padding: 26px 6px 22px;\n    page-break-after: always;\n  }\n  .doc { max-width: none; padding: 8px 6px 0; }\n\n  .section { page-break-inside: auto; break-inside: auto; }\n  .steps > li, .callout, .def-card, .flow-step, .err-card, .contact, .screen-row, .phone {\n    page-break-inside: avoid; break-inside: avoid;\n  }\n  .section-head, h2, h3, .subhead { page-break-after: avoid; }\n  .toc-list > li > a:hover { transform: none; }\n  .no-print { display: none !important; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<div class=\"bg-blobs\" aria-hidden=\"true\">\n  <span class=\"bg-blob b1\"><\u002Fspan>\n  <span class=\"bg-blob b2\"><\u002Fspan>\n  <span class=\"bg-blob b3\"><\u002Fspan>\n<\u002Fdiv>\n\n<!-- ════════════════════ COVER ════════════════════ -->\n<header class=\"cover\" data-screen-label=\"Portada\">\n  <img class=\"cover-logo\" src=\"439d9ed8-4479-4359-8176-f3b83abbf36c\" alt=\"Pinturas El Perico\">\n  <div class=\"cover-brand\">Pinturas El Perico · Sistema ERP<\u002Fdiv>\n  <h1>Manual<br>del <span class=\"thin\">Técnico<\u002Fspan><\u002Fh1>\n  <p class=\"cover-sub\">Tu guía operativa para el día a día en planta — de un vistazo, paso a paso.<\u002Fp>\n\n  <div class=\"cover-meta\">\n    <div class=\"meta-card\">\n      <div class=\"k\">Usuario<\u002Fdiv>\n      <div class=\"v\">Enrique<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"meta-card\">\n      <div class=\"k\">Rol<\u002Fdiv>\n      <div class=\"v\">Técnico de producción<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"meta-card\">\n      <div class=\"k\">PIN de acceso<\u002Fdiv>\n      <div class=\"v\">1122<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"meta-card\">\n      <div class=\"k\">Dirección<\u002Fdiv>\n      <div class=\"v small\">sistema.pinturaselperico.com<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"cover-foot\">Última revisión: junio 2026 · No compartas tu PIN con nadie.<\u002Fp>\n<\u002Fheader>\n\n<main class=\"doc\">\n\n  <!-- ════════════════════ ÍNDICE ════════════════════ -->\n  <section class=\"toc\" id=\"indice\" data-screen-label=\"Índice\">\n    <div class=\"eyebrow\">Índice<\u002Fdiv>\n    <h2 style=\"font-size:30px;margin-top:8px;\">¿Qué necesitas hacer hoy?<\u002Fh2>\n    <p class=\"lead\">Pulsa cualquier sección para ir directo a ella.<\u002Fp>\n    <ol class=\"toc-list\">\n      <li><a href=\"#sec1\"><span class=\"toc-num\">01<\u002Fspan><span class=\"toc-title\">Acceso al sistema<\u002Fspan><span class=\"toc-sub\">Entrar · instalar app · salir<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"#sec2\"><span class=\"toc-num\">02<\u002Fspan><span class=\"toc-title\">Pantallas que tienes disponibles<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"#sec3\"><span class=\"toc-num\">03<\u002Fspan><span class=\"toc-title\">Flujo principal de producción<\u002Fspan><span class=\"toc-sub\">El camino completo<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"#sec4\"><span class=\"toc-num\">04<\u002Fspan><span class=\"toc-title\">Cómo aceptar un pedido<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"#sec5\"><span class=\"toc-num\">05<\u002Fspan><span class=\"toc-title\">Cómo iniciar producción (wizard)<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"#sec6\"><span class=\"toc-num\">06<\u002Fspan><span class=\"toc-title\">Cómo registrar ajustes de MP<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"#sec7\"><span class=\"toc-num\">07<\u002Fspan><span class=\"toc-title\">Control de Calidad (QC)<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"#sec8\"><span class=\"toc-num\">08<\u002Fspan><span class=\"toc-title\">Cómo solicitar MP a Arely<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"#sec9\"><span class=\"toc-num\">09<\u002Fspan><span class=\"toc-title\">Cómo envasar un lote<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"#sec10\"><span class=\"toc-num\">10<\u002Fspan><span class=\"toc-title\">Transferir sublotes a Terán<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"#sec11\"><span class=\"toc-num\">11<\u002Fspan><span class=\"toc-title\">Cómo modificar el inventario<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"#sec12\"><span class=\"toc-num\">12<\u002Fspan><span class=\"toc-title\">Modo PRUEBA vs Modo Real<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"#sec13\"><span class=\"toc-num\">13<\u002Fspan><span class=\"toc-title\">Errores comunes y soluciones<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"#sec14\"><span class=\"toc-num\">14<\u002Fspan><span class=\"toc-title\">Buenas prácticas<\u002Fspan><\u002Fa><\u002Fli>\n      <li><a href=\"#sec15\"><span class=\"toc-num\">15<\u002Fspan><span class=\"toc-title\">Contactos<\u002Fspan><\u002Fa><\u002Fli>\n    <\u002Fol>\n  <\u002Fsection>\n\n  <!-- ════════════════════ 1. ACCESO ════════════════════ -->\n  <section class=\"section\" id=\"sec1\" data-screen-label=\"01 Acceso al sistema\">\n    <div class=\"section-head\">\n      <span class=\"section-num\">1<\u002Fspan>\n      <div>\n        <h2>Acceso al sistema<\u002Fh2>\n        <div class=\"sec-kicker\">Entrar, instalarlo como app y cerrar sesión correctamente.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 1.1 Iniciar sesión<\u002Fh3>\n    <p class=\"lead tight\">Abre el navegador (Chrome o Safari) y entra a la dirección del sistema.<\u002Fp>\n\n    <div class=\"mock-wrap\">\n      <div class=\"phone\">\n        <div class=\"phone-screen login-screen\">\n          <img class=\"login-logo\" src=\"439d9ed8-4479-4359-8176-f3b83abbf36c\" alt=\"\">\n          <div class=\"login-title\">Pinturas El Perico<\u002Fdiv>\n          <div class=\"login-sub\">Selecciona tu usuario<\u002Fdiv>\n          <div class=\"user-pill sel\">\n            <span class=\"up-av\">E<\u002Fspan>\n            <div><div class=\"up-name\">Enrique<\u002Fdiv><div class=\"up-role\">Técnico de producción<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"user-pill\">\n            <span class=\"up-av\" style=\"background:#6d4bb0\">J<\u002Fspan>\n            <div><div class=\"up-name\">Josué<\u002Fdiv><div class=\"up-role\">Almacén Terán<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pin-dots\"><i class=\"on\"><\u002Fi><i class=\"on\"><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv>\n          <div class=\"m-btn\" style=\"width:100%\">Entrar<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"mock-note\">\n        <ol class=\"steps\">\n          <li><span class=\"step-body\">Abre el navegador y escribe la URL <span class=\"kbd\">sistema.pinturaselperico.com<\u002Fspan>.<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Selecciona tu nombre en la lista de usuarios.<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Ingresa tu <strong>PIN<\u002Fstrong> (4 dígitos).<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Pulsa <span class=\"ui\">Entrar<\u002Fspan>. Vas directo al Dashboard.<\u002Fspan><\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"callout callout--ojo\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"><\u002Fpath><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"><\u002Fline><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"><\u002Fline><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">OJO — <\u002Fspan>Si tienes problemas para entrar, espera 30 segundos antes de reintentar. Tres intentos fallidos bloquean tu usuario por seguridad, y solo Emmanuel puede desbloquearlo.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 1.2 Instalar como app en el celular <span style=\"font-weight:400;color:var(--ink3);font-size:15px;\">(recomendado)<\u002Fspan><\u002Fh3>\n    <ol class=\"steps\">\n      <li><span class=\"step-body\">Entra a la URL en <strong>Chrome<\u002Fstrong> (Android) o <strong>Safari<\u002Fstrong> (iPhone).<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">En Chrome: menú de 3 puntos <span class=\"path\">arriba a la derecha <span class=\"arrow\">→<\u002Fspan> Instalar app<\u002Fspan>. En Safari: botón compartir <span class=\"path\"><span class=\"arrow\">→<\u002Fspan> Agregar a pantalla de inicio<\u002Fspan>.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Aparece un ícono en tu pantalla principal. Ábrelo: funciona como app, sin barra de URL.<\u002Fspan><\u002Fli>\n    <\u002Fol>\n    <div class=\"callout callout--info\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"><\u002Fline><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">INFO — <\u002Fspan>La app instalada se actualiza sola cuando hay nueva versión. Si la pantalla se queda en blanco o ves información vieja, cierra la app y vuelve a abrirla.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 1.3 Cerrar sesión<\u002Fh3>\n    <p class=\"lead tight\">En la barra de arriba, ícono de tu nombre <span class=\"path\"><span class=\"arrow\">→<\u002Fspan> Cerrar sesión<\u002Fspan>. Hazlo <strong style=\"color:var(--green-deep);font-weight:500\">siempre<\u002Fstrong> al terminar tu turno, sobre todo si la tablet la usan varios.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ════════════════════ 2. PANTALLAS ════════════════════ -->\n  <section class=\"section\" id=\"sec2\" data-screen-label=\"02 Pantallas disponibles\">\n    <div class=\"section-head\">\n      <span class=\"section-num\">2<\u002Fspan>\n      <div>\n        <h2>Pantallas que tienes disponibles<\u002Fh2>\n        <div class=\"sec-kicker\">Tus accesos están en el menú lateral (compu) o en la barra inferior (celular).<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"screens-list\">\n      <div class=\"screen-row\">\n        <span class=\"sr-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"9\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"5\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"12\" width=\"7\" height=\"9\" rx=\"1.5\"><\u002Frect><rect x=\"3\" y=\"16\" width=\"7\" height=\"5\" rx=\"1.5\"><\u002Frect><\u002Fsvg><\u002Fspan>\n        <div><div class=\"sr-name\">Dashboard<\u002Fdiv><div class=\"sr-desc\">Pantalla de inicio. Resumen del día: pedidos pendientes, órdenes activas, alertas.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"screen-row\">\n        <span class=\"sr-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 2h6a1 1 0 0 1 1 1v1h1a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1z\"><\u002Fpath><path d=\"M9 12l2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div><div class=\"sr-name\">Pedidos<\u002Fdiv><div class=\"sr-desc\">Solicitudes que vienen de Almacén Terán (Josué). Tu trabajo arranca aquí: aceptas y conviertes en orden.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"screen-row\">\n        <span class=\"sr-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16M4 12h16M4 19h10\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div><div class=\"sr-name\">Órdenes<\u002Fdiv><div class=\"sr-desc\">Lotes en producción: en proceso, pendientes, terminadas. Sub-tab “OC MP” para solicitar materia prima a Arely.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"screen-row\">\n        <span class=\"sr-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 3h6v4l3 9a2 2 0 0 1-2 2.6H8A2 2 0 0 1 6 16l3-9z\"><\u002Fpath><path d=\"M8 3h8\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div><div class=\"sr-name\">Producción<\u002Fdiv><div class=\"sr-desc\">Wizard paso a paso para fabricar un lote: pesar, mezclar, dispersar, QC, ajustes, finalizar.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"screen-row\">\n        <span class=\"sr-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7l9-4 9 4-9 4-9-4z\"><\u002Fpath><path d=\"M3 7v10l9 4 9-4V7\"><\u002Fpath><path d=\"M12 11v10\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div><div class=\"sr-name\">Stock Fábrica<\u002Fdiv><div class=\"sr-desc\">Lotes ya producidos que están en planta esperando envasado o transferencia a Terán.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"screen-row\">\n        <span class=\"sr-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div><div class=\"sr-name\">Trazabilidad<\u002Fdiv><div class=\"sr-desc\">Historial completo de cada lote: quién lo hizo, cuándo, sublotes, estado actual.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"screen-row\">\n        <span class=\"sr-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18M3 12h18M3 18h18\"><\u002Fpath><circle cx=\"8\" cy=\"6\" r=\"2\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><circle cx=\"16\" cy=\"12\" r=\"2\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><circle cx=\"7\" cy=\"18\" r=\"2\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n        <div><div class=\"sr-name\">Inventario<\u002Fdiv><div class=\"sr-desc\">Consulta el stock de materias primas y producto terminado. Editar requiere código de autorización.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"screen-row\">\n        <span class=\"sr-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 4h16v4H4z\"><\u002Fpath><path d=\"M4 12h10M4 16h10M4 20h7\"><\u002Fpath><path d=\"M17 13l4 4-4 4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div><div class=\"sr-name\">Fórmulas<\u002Fdiv><div class=\"sr-desc\">Catálogo de fórmulas. Solo lectura: ves ingredientes y propiedades técnicas, no modificas.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"screen-row\">\n        <span class=\"sr-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9z\"><\u002Fpath><path d=\"M13.7 21a2 2 0 0 1-3.4 0\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div><div class=\"sr-name\">Notificaciones<\u002Fdiv><div class=\"sr-desc\">Alertas del sistema: stock crítico, lotes en QC, OCs vencidas.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ════════════════════ 3. FLUJO ════════════════════ -->\n  <section class=\"section\" id=\"sec3\" data-screen-label=\"03 Flujo de producción\">\n    <div class=\"section-head\">\n      <span class=\"section-num\">3<\u002Fspan>\n      <div>\n        <h2>Flujo principal de producción<\u002Fh2>\n        <div class=\"sec-kicker\">El camino completo: desde que llega un pedido hasta que Luis lo recoge para Terán.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"flow\">\n      <div class=\"flow-step\"><div class=\"flow-rail\"><span class=\"flow-node\">1<\u002Fspan><span class=\"flow-line\"><\u002Fspan><\u002Fdiv>\n        <div class=\"flow-card\"><div class=\"fc-who\">Josué · Almacén Terán<\u002Fdiv><div class=\"fc-text\">Crea el pedido en su pantalla.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"flow-step\"><div class=\"flow-rail\"><span class=\"flow-node\">2<\u002Fspan><span class=\"flow-line\"><\u002Fspan><\u002Fdiv>\n        <div class=\"flow-card\"><div class=\"fc-who\">Tú<\u002Fdiv><div class=\"fc-text\">Ves el pedido en tu tab <strong>Pedidos<\u002Fstrong> con estado “Pendiente”.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"flow-step\"><div class=\"flow-rail\"><span class=\"flow-node\">3<\u002Fspan><span class=\"flow-line\"><\u002Fspan><\u002Fdiv>\n        <div class=\"flow-card\"><div class=\"fc-who\">Tú<\u002Fdiv><div class=\"fc-text\">Pulsas <strong>Crear Orden<\u002Fstrong> → el sistema valida que haya stock de MP y crea la orden vinculada.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"flow-step\"><div class=\"flow-rail\"><span class=\"flow-node\">4<\u002Fspan><span class=\"flow-line\"><\u002Fspan><\u002Fdiv>\n        <div class=\"flow-card\"><div class=\"fc-who\">Tú · Producción<\u002Fdiv><div class=\"fc-text\">Abres el <strong>wizard<\u002Fstrong> y sigues los pasos en orden: pesar, mezclar, dispersar, agitar.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"flow-step\"><div class=\"flow-rail\"><span class=\"flow-node\">5<\u002Fspan><span class=\"flow-line\"><\u002Fspan><\u002Fdiv>\n        <div class=\"flow-card\"><div class=\"fc-who\">Tú · Ajustes<\u002Fdiv><div class=\"fc-text\">Registras si agregaste más espesante, agua o TiO₂ durante el batch.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"flow-step\"><div class=\"flow-rail\"><span class=\"flow-node\">6<\u002Fspan><span class=\"flow-line\"><\u002Fspan><\u002Fdiv>\n        <div class=\"flow-card\"><div class=\"fc-who\">Tú · QC<\u002Fdiv><div class=\"fc-text\">Mides el QC final. Si todo está en rango, el lote se <strong>aprueba automáticamente<\u002Fstrong>.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"flow-step\"><div class=\"flow-rail\"><span class=\"flow-node\">7<\u002Fspan><span class=\"flow-line\"><\u002Fspan><\u002Fdiv>\n        <div class=\"flow-card\"><div class=\"fc-who\">Tú · Stock Fábrica<\u002Fdiv><div class=\"fc-text\">El lote pasa a Stock Fábrica. Lo envasas en sublotes con la marca/tapa que corresponde.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"flow-step\"><div class=\"flow-rail\"><span class=\"flow-node\">8<\u002Fspan><span class=\"flow-line\"><\u002Fspan><\u002Fdiv>\n        <div class=\"flow-card\"><div class=\"fc-who\">Tú → Luis<\u002Fdiv><div class=\"fc-text\">Cuando todo está envasado, transfieres a Terán. Luis lo recoge.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"flow-step\"><div class=\"flow-rail\"><span class=\"flow-node\" style=\"background:var(--green-deep)\">9<\u002Fspan><\u002Fdiv>\n        <div class=\"flow-card\" style=\"border-left:3px solid var(--green)\"><div class=\"fc-who\">Josué<\u002Fdiv><div class=\"fc-text\">Confirma recepción en Terán. El pedido queda como “entregado” y se cierra.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"callout callout--tip\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18h6M10 22h4\"><\u002Fpath><path d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A7 7 0 0 0 12 2z\"><\u002Fpath><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">TIP — <\u002Fspan>Cada paso queda registrado con tu nombre, hora y datos. La trazabilidad es automática: no tienes que llenar reportes manuales.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ════════════════════ 4. ACEPTAR PEDIDO ════════════════════ -->\n  <section class=\"section\" id=\"sec4\" data-screen-label=\"04 Aceptar un pedido\">\n    <div class=\"section-head\">\n      <span class=\"section-num\">4<\u002Fspan>\n      <div>\n        <h2>Cómo aceptar un pedido<\u002Fh2>\n        <div class=\"sec-kicker\">Dos caminos para tomar un pedido y convertirlo en orden.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"mock-wrap\">\n      <div class=\"phone\">\n        <div class=\"phone-screen\">\n          <div class=\"ps-status\"><span>9:41<\u002Fspan><span class=\"dots\">▰▰▰ 100%<\u002Fspan><\u002Fdiv>\n          <div class=\"ps-body\">\n            <div class=\"ps-appbar\"><span class=\"ab-title\">Pedidos<\u002Fspan><span class=\"ps-avatar\">E<\u002Fspan><\u002Fdiv>\n            <div class=\"m-card\">\n              <div class=\"m-row\"><span class=\"m-code\">PED-1042<\u002Fspan><span class=\"m-badge b-amber\">Pendiente<\u002Fspan><\u002Fdiv>\n              <div class=\"m-title\" style=\"margin-top:5px\">Vinílica Premium Blanco<\u002Fdiv>\n              <div class=\"m-sub\">200 L · solicita Josué<\u002Fdiv>\n              <div class=\"m-btn\" style=\"margin-top:9px\">Aceptar<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"m-card\">\n              <div class=\"m-row\"><span class=\"m-code\">PED-1041<\u002Fspan><span class=\"m-badge b-green\">Aceptado<\u002Fspan><\u002Fdiv>\n              <div class=\"m-title\" style=\"margin-top:5px\">Esmalte Astra Negro<\u002Fdiv>\n              <div class=\"m-sub\">80 L · OP-0335<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"m-card prueba\">\n              <div class=\"m-row\"><span class=\"m-code\">PED-1039<\u002Fspan><span class=\"m-badge b-amber\">PRUEBA<\u002Fspan><\u002Fdiv>\n              <div class=\"m-title\" style=\"margin-top:5px\">Fórmula nueva — muestra<\u002Fdiv>\n              <div class=\"m-sub\">20 L · no descuenta MP<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"mock-note\">\n        <h4>4.1 Desde la tab Pedidos<\u002Fh4>\n        <ol class=\"steps compact\">\n          <li><span class=\"step-body\">Ve a la sección <span class=\"ui\">Pedidos<\u002Fspan>.<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Los pendientes aparecen arriba en la lista.<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Pulsa <span class=\"ui\">Aceptar<\u002Fspan> en el pedido que vas a tomar.<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">El sistema crea la orden vinculada y el pedido pasa a “Aceptado”.<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Conserva su código <span class=\"kbd\">PED-…<\u002Fspan> y suma uno de orden <span class=\"kbd\">OP-…<\u002Fspan>.<\u002Fspan><\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 4.2 Desde Órdenes → bloque “Pedidos de Almacén”<\u002Fh3>\n    <p class=\"lead tight\">En la pestaña <span class=\"ui\">Órdenes<\u002Fspan>, arriba aparece un bloque con los pedidos pendientes. Pulsa <span class=\"path\">→ Crear Orden<\u002Fspan> en el que quieras.<\u002Fp>\n    <ol class=\"steps\">\n      <li><span class=\"step-body\">Se abre un modal <strong>“Crear Orden desde Pedido”<\u002Fstrong> con los datos prellenados y bloqueados (producto, cantidad, prueba/real).<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Si quieres comenzar de una vez, marca el checkbox <span class=\"ui\">Iniciar producción inmediatamente<\u002Fspan>.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Pulsa <span class=\"ui\">Crear orden<\u002Fspan> (o <span class=\"ui\">Crear orden e iniciar<\u002Fspan>).<\u002Fspan><\u002Fli>\n    <\u002Fol>\n    <div class=\"callout callout--info\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"><\u002Fline><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">INFO — <\u002Fspan>El producto, la cantidad y la marca de PRUEBA vienen del pedido y NO se pueden cambiar al crear la orden. Esto evita errores: lo que pidió Josué es lo que se produce.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 4.3 Verificación de stock automática<\u002Fh3>\n    <p class=\"lead tight\">Antes de crear la orden, el sistema verifica el stock de materias primas. Puedes ver tres resultados:<\u002Fp>\n    <div class=\"cards three\">\n      <div class=\"def-card accent-green\">\n        <div class=\"dc-top\"><span class=\"badge b-green\"><span class=\"d\"><\u002Fspan>Stock OK<\u002Fspan><\u002Fdiv>\n        <div class=\"dc-desc\">Hay MP suficiente. Puedes producir sin problemas.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"def-card accent-red\">\n        <div class=\"dc-top\"><span class=\"badge b-red\"><span class=\"d\"><\u002Fspan>Faltan MPs<\u002Fspan><\u002Fdiv>\n        <div class=\"dc-desc\">Te muestra la lista con kg faltantes y lead time del proveedor. Puedes crear la orden, pero “Iniciar producción” queda bloqueado.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"def-card accent-gray\">\n        <div class=\"dc-top\"><span class=\"badge b-gray\"><span class=\"d\"><\u002Fspan>Sin verificación<\u002Fspan><\u002Fdiv>\n        <div class=\"dc-desc\">Solo aparece para pedidos en modo PRUEBA (no descuentan MP).<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"callout callout--ojo\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"><\u002Fpath><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"><\u002Fline><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"><\u002Fline><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">OJO — <\u002Fspan>Si falta MP, NO inicies producción a la fuerza. Crea primero una solicitud OC a Arely (sección 8).<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ════════════════════ 5. WIZARD ════════════════════ -->\n  <section class=\"section\" id=\"sec5\" data-screen-label=\"05 Iniciar producción (wizard)\">\n    <div class=\"section-head\">\n      <span class=\"section-num\">5<\u002Fspan>\n      <div>\n        <h2>Cómo iniciar producción (wizard)<\u002Fh2>\n        <div class=\"sec-kicker\">El wizard te guía paso a paso, con timers, instrucciones y validaciones antes de avanzar.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"mock-wrap\">\n      <div class=\"phone\">\n        <div class=\"phone-screen\">\n          <div class=\"ps-status\"><span>9:41<\u002Fspan><span class=\"dots\">▰▰▰ 100%<\u002Fspan><\u002Fdiv>\n          <div class=\"ps-body\">\n            <div class=\"ps-appbar\"><span class=\"ab-title\" style=\"font-size:15px\">Dispersión · paso 3/7<\u002Fspan><\u002Fdiv>\n            <div class=\"wiz-steps\"><i class=\"done\"><\u002Fi><i class=\"done\"><\u002Fi><i class=\"on\"><\u002Fi><i><\u002Fi><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv>\n            <div class=\"m-card solid-card\">\n              <div class=\"timer-ring\">\n                <div class=\"tr-time\">18:24<\u002Fdiv>\n                <div class=\"tr-label\">Tiempo restante · 20 min<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"m-prog\"><i style=\"width:42%\"><\u002Fi><\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"m-card\">\n              <div class=\"m-title\">Instrucción<\u002Fdiv>\n              <div class=\"m-sub\" style=\"line-height:1.45\">Dispersa a 1200 rpm. El sistema te avisa al terminar — el timer sigue aunque bloquees la pantalla.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"m-btn ghost\">Pausar paso<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"mock-note\">\n        <h4>5.1 Abrir el wizard<\u002Fh4>\n        <ol class=\"steps compact\">\n          <li><span class=\"step-body\">Ve a <span class=\"path\">Producción <span class=\"arrow\">→<\u002Fspan> Lanzar lote<\u002Fspan>.<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Busca la orden en estado “en_produccion” o “aceptado”.<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Pulsa <span class=\"ui\">Producir<\u002Fspan>.<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Acepta el modal <strong>NDA<\u002Fstrong> (confidencialidad).<\u002Fspan><\u002Fli>\n          <li><span class=\"step-body\">Se abre el wizard. Primer paso: lista de MP a pesar.<\u002Fspan><\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 5.2 Pasos típicos del wizard<\u002Fh3>\n    <div class=\"cards two\">\n      <div class=\"def-card\"><div class=\"dc-title\">Pesaje MP<\u002Fdiv><div class=\"dc-desc\">Lista de materias primas con cantidades exactas. Marca cada una conforme pesas.<\u002Fdiv><\u002Fdiv>\n      <div class=\"def-card\"><div class=\"dc-title\">Mezcla<\u002Fdiv><div class=\"dc-desc\">Sigue el orden de adición. Activa el timer si aplica.<\u002Fdiv><\u002Fdiv>\n      <div class=\"def-card\"><div class=\"dc-title\">Dispersión<\u002Fdiv><div class=\"dc-desc\">Activa el timer (15–30 min típicos). El sistema te avisa al terminar.<\u002Fdiv><\u002Fdiv>\n      <div class=\"def-card\"><div class=\"dc-title\">QC post-molienda<\u002Fdiv><div class=\"dc-desc\">Mides finura Hegman. Debe estar entre 4 y 8. Si no, regresas al molino.<\u002Fdiv><\u002Fdiv>\n      <div class=\"def-card\"><div class=\"dc-title\">Ajustes MP <span style=\"color:var(--ink3);font-weight:400\">(opcional)<\u002Fspan><\u002Fdiv><div class=\"dc-desc\">Si agregaste más espesante, agua o pigmento, regístralo aquí. Ver sección 6.<\u002Fdiv><\u002Fdiv>\n      <div class=\"def-card\"><div class=\"dc-title\">QC pre-envasado<\u002Fdiv><div class=\"dc-desc\">Mides viscosidad, pH, densidad, color y apariencia. En rango → se aprueba solo.<\u002Fdiv><\u002Fdiv>\n      <div class=\"def-card accent-green\"><div class=\"dc-title\">Finalizar<\u002Fdiv><div class=\"dc-desc\">El sistema descuenta MP, crea el lote y lo deja en “qc_aprobado”, listo para envasar.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 5.3 Reglas del wizard<\u002Fh3>\n    <div class=\"callout callout--tip\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18h6M10 22h4\"><\u002Fpath><path d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A7 7 0 0 0 12 2z\"><\u002Fpath><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">TIP — <\u002Fspan>Puedes cerrar el wizard a mitad del proceso. El sistema guarda checkpoint automático. Cuando vuelvas, continúas exactamente donde lo dejaste.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"callout callout--ojo\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"><\u002Fpath><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"><\u002Fline><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"><\u002Fline><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">OJO — <\u002Fspan>No puedes avanzar si los valores de QC están fuera de rango. El botón “Siguiente” se bloquea hasta que ajustes los valores o corrijas el batch.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"callout callout--info\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"><\u002Fline><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">INFO — <\u002Fspan>El timer NO se pausa cuando bloqueas la pantalla del celular. El tiempo sigue corriendo en el fondo.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ════════════════════ 6. AJUSTES MP ════════════════════ -->\n  <section class=\"section\" id=\"sec6\" data-screen-label=\"06 Ajustes de MP\">\n    <div class=\"section-head\">\n      <span class=\"section-num\">6<\u002Fspan>\n      <div>\n        <h2>Cómo registrar ajustes de MP<\u002Fh2>\n        <div class=\"sec-kicker\">Casi siempre agregas algo extra durante el batch. Si no lo registras, el inventario se desfasa.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 6.1 Dónde se registra<\u002Fh3>\n    <p class=\"lead tight\">En el wizard, entre <span class=\"kbd\">QC post-molienda<\u002Fspan> y <span class=\"kbd\">QC pre-envasado<\u002Fspan>, aparece un paso llamado <strong style=\"color:var(--green-deep);font-weight:500\">Ajustes MP (opcional)<\u002Fstrong>. Ahí registras cada ajuste antes de avanzar.<\u002Fp>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 6.2 Cómo registrar un ajuste<\u002Fh3>\n    <ol class=\"steps\">\n      <li><span class=\"step-body\">En el paso de Ajustes, pulsa <span class=\"ui\">+ Agregar ajuste<\u002Fspan>.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Selecciona o escribe el nombre exacto de la MP (debe coincidir con el catálogo).<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Anota los <strong>kg adicionales<\u002Fstrong> que agregaste.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Escribe el motivo en una frase corta: “viscosidad baja”, “color débil”, “muy líquido”.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Si agregaste varias MPs, pulsa de nuevo <span class=\"ui\">+ Agregar ajuste<\u002Fspan>.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Cuando termines, pulsa <span class=\"ui\">Siguiente<\u002Fspan> para continuar con el QC final.<\u002Fspan><\u002Fli>\n    <\u002Fol>\n    <div class=\"callout callout--info\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"8\" x2=\"12.01\" y2=\"8\"><\u002Fline><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">INFO — <\u002Fspan>Si no hubo ajustes, deja la lista vacía y avanza. El paso es opcional.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"callout callout--evitar\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"4.93\" y1=\"4.93\" x2=\"19.07\" y2=\"19.07\"><\u002Fline><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">EVITAR — <\u002Fspan>Los kg que registres aquí se DESCUENTAN del inventario al finalizar. Si pones de más, el inventario queda bajo y se genera alerta de stock. Si pones de menos, Burgos encontrará varianzas en el conteo físico. Sé exacto.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 6.3 Ejemplos típicos<\u002Fh3>\n    <div class=\"cards two\">\n      <div class=\"def-card accent-blue\"><div class=\"dc-title\">Viscosidad salió en 70 KU (bajo)<\u002Fdiv><div class=\"dc-desc\">Agregaste 1.5 kg de W-5916 (espesante). Lo registras como ajuste.<\u002Fdiv><\u002Fdiv>\n      <div class=\"def-card accent-blue\"><div class=\"dc-title\">Color quedó débil<\u002Fdiv><div class=\"dc-desc\">Agregaste 0.8 kg de TiO₂. Lo registras.<\u002Fdiv><\u002Fdiv>\n      <div class=\"def-card accent-blue\"><div class=\"dc-title\">Mezcla muy espesa, no se vacía bien<\u002Fdiv><div class=\"dc-desc\">Agregaste 3 kg de agua. Lo registras.<\u002Fdiv><\u002Fdiv>\n      <div class=\"def-card accent-gray\"><div class=\"dc-title\">No agregaste nada extra<\u002Fdiv><div class=\"dc-desc\">Dejas la lista vacía y avanzas.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ════════════════════ 7. QC ════════════════════ -->\n  <section class=\"section\" id=\"sec7\" data-screen-label=\"07 Control de Calidad\">\n    <div class=\"section-head\">\n      <span class=\"section-num\">7<\u002Fspan>\n      <div>\n        <h2>Control de Calidad (QC)<\u002Fh2>\n        <div class=\"sec-kicker\">Dos paradas de QC en el wizard, aprobación automática y qué hacer si falla.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"mock-wrap\">\n      <div class=\"mock-note\">\n        <h4>7.1 QC durante el wizard<\u002Fh4>\n        <p style=\"margin-bottom:14px\">Dos paradas: <strong style=\"color:var(--green-deep);font-weight:500\">post-molienda<\u002Fstrong> (finura Hegman) y <strong style=\"color:var(--green-deep);font-weight:500\">pre-envasado<\u002Fstrong> (viscosidad, pH, densidad, color, apariencia). Mides cada parámetro y lo capturas.<\u002Fp>\n        <h4>7.2 Aprobación automática<\u002Fh4>\n        <p>Al finalizar, si TODAS las mediciones están en rango, el lote pasa solo a <span class=\"kbd\">qc_aprobado<\u002Fspan> y ya puede envasarse. No necesitas doble entrada en otra pantalla.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"phone\">\n        <div class=\"phone-screen\">\n          <div class=\"ps-status\"><span>9:41<\u002Fspan><span class=\"dots\">▰▰▰ 100%<\u002Fspan><\u002Fdiv>\n          <div class=\"ps-body\">\n            <div class=\"ps-appbar\"><span class=\"ab-title\" style=\"font-size:15px\">QC pre-envasado<\u002Fspan><\u002Fdiv>\n            <div class=\"m-card solid-card\">\n              <div class=\"qc-grid\">\n                <div class=\"qc-chip ok\"><div class=\"qc-k\">Viscosidad<\u002Fdiv><div class=\"qc-v\">95 KU<\u002Fdiv><\u002Fdiv>\n                <div class=\"qc-chip ok\"><div class=\"qc-k\">pH<\u002Fdiv><div class=\"qc-v\">8.4<\u002Fdiv><\u002Fdiv>\n                <div class=\"qc-chip ok\"><div class=\"qc-k\">Densidad<\u002Fdiv><div class=\"qc-v\">1.32<\u002Fdiv><\u002Fdiv>\n                <div class=\"qc-chip ok\"><div class=\"qc-k\">Color<\u002Fdiv><div class=\"qc-v\">OK<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"m-card\" style=\"background:var(--okgreen-bg);border:1px solid color-mix(in srgb, var(--green) 25%, transparent)\">\n              <div class=\"m-row\"><span class=\"m-title\" style=\"color:var(--green-deep)\">Todo en rango<\u002Fspan><span class=\"m-badge b-green\">qc_aprobado<\u002Fspan><\u002Fdiv>\n              <div class=\"m-sub\">El lote se aprueba automáticamente.<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"m-btn\">Finalizar lote<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 7.3 Aprobación manual desde la tab Calidad<\u002Fh3>\n    <p class=\"lead tight\">Si el lote quedó en estado “producido” (no se autorizó solo), puedes aprobarlo manualmente:<\u002Fp>\n    <ol class=\"steps\">\n      <li><span class=\"step-body\">Ve a <span class=\"path\">Producción <span class=\"arrow\">→<\u002Fspan> Calidad QC<\u002Fspan>.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Busca los lotes pendientes de QC.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Pulsa <span class=\"ui\">Aprobar<\u002Fspan> en el lote que vas a revisar.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Ingresa los valores medidos y confirma.<\u002Fspan><\u002Fli>\n    <\u002Fol>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 7.4 Si el QC falla <span style=\"font-weight:400;color:var(--ink3);font-size:15px;\">(qc_hold)<\u002Fspan><\u002Fh3>\n    <p class=\"lead tight\">Si una medición está fuera de rango, el lote queda en <span class=\"kbd\">qc_hold<\u002Fspan> y no se puede envasar. Avisa a <strong style=\"color:var(--green-deep);font-weight:500\">Emmanuel<\u002Fstrong> para decidir si:<\u002Fp>\n    <ol class=\"steps\">\n      <li><span class=\"step-body\">Se ajusta con aditivos correctivos y se vuelve a hacer QC.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Se mezcla con otro lote bueno para diluir el problema.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Se descarta como merma (se libera la cuba para el siguiente batch).<\u002Fspan><\u002Fli>\n    <\u002Fol>\n    <div class=\"callout callout--ojo\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"><\u002Fpath><line x1=\"12\" y1=\"9\" x2=\"12\" y2=\"13\"><\u002Fline><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"><\u002Fline><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">OJO — <\u002Fspan>No tomes la decisión solo. Un lote fuera de spec puede salir defectuoso al cliente y generar devoluciones costosas.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ════════════════════ 8. OC MP ════════════════════ -->\n  <section class=\"section\" id=\"sec8\" data-screen-label=\"08 Solicitar MP a Arely\">\n    <div class=\"section-head\">\n      <span class=\"section-num\">8<\u002Fspan>\n      <div>\n        <h2>Cómo solicitar MP a Arely (OC MP)<\u002Fh2>\n        <div class=\"sec-kicker\">No llames por WhatsApp: crea la solicitud y le llega directo.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 8.1 Crear solicitud<\u002Fh3>\n    <ol class=\"steps\">\n      <li><span class=\"step-body\">Ve a <span class=\"path\">Órdenes <span class=\"arrow\">→<\u002Fspan> OC MP<\u002Fspan>.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Pulsa <span class=\"ui\">+ Nueva Solicitud<\u002Fspan> arriba a la derecha.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Se abre el modal “Nueva Solicitud de MP”.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Por cada MP: escribe el nombre (autocompleta del catálogo) y los kg.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Si necesitas varias MPs, pulsa <span class=\"ui\">+ Agregar otra MP<\u002Fspan>.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Selecciona la prioridad: <span class=\"badge b-gray\">Baja<\u002Fspan> <span class=\"badge b-blue\">Normal<\u002Fspan> <span class=\"badge b-red\">Urgente<\u002Fspan><\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Si conoces el proveedor preferido, escríbelo (opcional, Arely puede cambiarlo).<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">En Notas pon el motivo: “urge para terminar orden #1234”, “stock crítico”, etc.<\u002Fspan><\u002Fli>\n      <li><span class=\"step-body\">Pulsa <span class=\"ui\">Enviar a compras<\u002Fspan>.<\u002Fspan><\u002Fli>\n    <\u002Fol>\n    <div class=\"callout callout--tip\">\n      <svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18h6M10 22h4\"><\u002Fpath><path d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A7 7 0 0 0 12 2z\"><\u002Fpath><\u002Fsvg>\n      <div class=\"co-body\"><span class=\"co-tag\">TIP — <\u002Fspan>Arely recibe una notificación push de inmediato. Aún en silencio, verá la alerta al abrir la app. No tienes que confirmarle por otro medio.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"subhead\"><span class=\"dot\">·<\u002Fspan> 8.2 Ver tus solicitudes<\u002Fh3>\n    <p class=\"lead tight\">En la misma pestaña <span class=\"ui\">OC MP<\u002Fspan>, sub-tab <span class=\"ui\">Mis solicitudes<\u002Fspan>. Cada una muestra su estado:<\u002Fp>\n    <div class=\"cards two\">\n      <div class=\"def-card accent-amber\"><div class=\"dc-top\"><span class=\"badge b-amber\"><span class=\"d\"><\u002Fspan>Pendiente Aprobación<\u002Fspan><\u002Fdiv><div class=\"dc-desc\">Arely aún no la ha procesado.<\u002Fdiv><\u002Fdiv>\n      <div class=\"def-card accent-blue\"><div class=\"dc-top\"><span class=\"badge b-blue\"><span class=\"d\"><\u002Fspan>Aprobada<\u002Fspan><\u002Fdiv><div class=\"dc-desc\">Arely la aprobó y está gestionando la compra.<\u002Fdiv><\u002Fdiv>\n      <div class=\"def-card accent-blue\"><div class=\"dc-top\"><span class=\"badge b-blue\"><span class=\"d\"><\u002Fspan>Enviada<\u002Fspan><\u002Fdiv><div class=\"dc-desc\">El proveedor ya envió la mercancía. En camino.<\u002Fdiv><\u002Fdiv>\n      <div class=\"def-card accent-amber\"><div class=\"dc-top\"><span class=\"badge b-amber\"><span class=\"d\"><\u002Fspan>Recibida Parcial<\u002Fspan><\u002Fdiv><div class=\"dc-desc\">Llegó parte del pedido. Falta el resto.<\u002Fdiv><\u002Fdiv>\n      <div class=\"def-card accent-green\"><div class=\"dc-top\"><span class=\"badge b-green\"><span class=\"d\"><\u002Fspan>Recibida<\u002Fspan><\u002Fdiv><div class=\"dc-desc\">Todo llegó al almacén y se sumó al inventario.<\u002Fdiv><\u002Fdiv>\n      <div class=\"def-card accent-red\"><div class=\"dc-top\"><span class=\"badge b-red\"><span class=\"d\"><\u002Fspan>Rechazada<\u002Fspan><\u002Fdiv><div class=\"dc-desc\">Arely no aprobó. Revisa la nota del motivo.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ════════════════════ 9. ENVASAR ════════════════════ -->\n  <section class=\"section\" id=\"sec9\" data-screen-label=\"09 Envasar un lote\">\n    <div class=\"section-head\">\n      <span class=\"section-num\">9<\u002Fspan>\n      <div>\n        <h2>Cómo envasar un lote<\u002Fh2>\n        <div class=\"sec-kicker\">Cuando un lote está en qc_aprobado: completo o en sublotes, cada uno con su QR.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"mock-wrap\">\n      <div class=\"phone\">\n        <div class=\"phone-screen\">\n          <div class=\"ps-status\"><span>9:41<\u002Fspan><span class=\"dots\">▰▰▰ 100%<\u002Fspan><\u002Fdiv>\n          <div class=\"ps-body\">\n            <div class=\"ps-appbar\"><span class=\"ab-title\" style=\"font-size
